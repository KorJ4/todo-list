{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 fw-bold mb-0">Tags</h1>
    <a href="{% url 'todo:tag-create' %}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Add tag</a>
  </div>
  {% if tag_list %}
    <div class="card task-card">
      <table class="table align-middle mb-0">
        <thead>
          <tr>
            <th>Name</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for tag in tag_list %}
            <tr>
              <td>{{ tag.name }}</td>
              <td class="text-end">
                <a href="{% url 'todo:tag-update' pk=tag.id %}" class="btn btn-outline-primary btn-sm">Update</a>
                <a href="{% url 'todo:tag-delete' pk=tag.id %}" class="btn btn-outline-danger btn-sm">Delete</a>
              </td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% else %}
    <p class="text-muted">There are no tags yet.</p>
  {% endif %}
{% endblock %}
